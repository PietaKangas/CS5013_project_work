spring.application.name=student-management-system

# ---------- Database ----------
# Values come from environment variables; the part after ':' is a local-dev default.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# Flyway creates and updates the tables (see src/main/resources/db/migration).
# Hibernate must NOT change the schema itself, so ddl-auto is "none".
# To change the database, add a new file V5__..., never edit an applied one.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# Must be at least 32 characters. Set JWT_SECRET in your environment for anything
# beyond local development; the default below is for your own machine only.
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ---------- First International Lead account ----------
# If both are set, a Lead account is created on startup (only if that email doesn't exist yet).
app.bootstrap-lead.email=${LEAD_EMAIL:}
app.bootstrap-lead.password=${LEAD_PASSWORD:}
app.bootstrap-lead.full-name=${LEAD_NAME:OGE International Lead}

# ---------- Document uploads ----------
# Folder for uploaded files (created automatically). Keep it outside the web root;
# files are only served through the authenticated /api/documents/{id}/file endpoint.
app.upload-dir=${UPLOAD_DIR:./uploads}
app.max-upload-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Let Tomcat read an oversized upload fully so the browser receives our 413 JSON error.
server.tomcat.max-swallow-size=20MB

# ---------- Demo data (fictional students + SAMPLE documents) ----------
# Set DEMO_DATA=true to load 8 fictional students in different review states.
# Never use real student documents for testing; use the files in src/main/resources/demo-documents/.
app.demo-data.enabled=${DEMO_DATA:false}
app.demo-data.password=${DEMO_PASSWORD:Student123}

# ---------- CORS (React dev server) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
